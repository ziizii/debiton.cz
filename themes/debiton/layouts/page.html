{{ define "main" }}
{{ partial "page-header.html" . }}
<main class="py-12 pb-[72px]">
  <div class="mx-auto max-w-[760px] px-6 max-[480px]:px-4">
    <h1 class="mb-2 text-[clamp(28px,4vw,38px)] leading-[1.15] tracking-[-.02em]">{{ .Title }}</h1>
    {{ with .Params.validFrom }}<p class="mb-8 text-muted">{{ . }}</p>{{ end }}
    <div class="prose-page">{{ .Content }}</div>
  </div>
</main>
{{ partial "footer.html" . }}
{{ end }}
