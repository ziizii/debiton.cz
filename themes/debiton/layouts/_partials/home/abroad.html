{{- with .Params.abroad }}
<section class="py-[clamp(64px,9vw,112px)]" id="{{ .id }}">
  <div class="wrap grid grid-cols-[minmax(0,.9fr)_minmax(0,1.1fr)] items-start gap-14 max-[900px]:grid-cols-1 max-[900px]:gap-7">
    <div>
      <h2 class="h-section">{{ .title | safeHTML }}</h2>
      <p class="mt-4 max-w-[36em] text-[18.5px] text-muted">{{ .lead | safeHTML }}</p>
    </div>
    <ul class="border-b border-line-2">
      {{- range .items }}
      <li class="border-t border-line-2 py-[18px]"><b class="mb-[3px] block text-lg font-semibold">{{ .title | safeHTML }}</b><span class="text-base text-muted">{{ .text | safeHTML }}</span></li>
      {{- end }}
    </ul>
  </div>
</section>
{{- end }}
