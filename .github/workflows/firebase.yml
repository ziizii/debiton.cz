name: Deploy production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

env:
  HUGO_VERSION: '0.170.0'

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://www.debiton.cz/
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0     # enableGitInfo: real <lastmod> per page
          filter: blob:none  # full history without old file contents

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      - name: Install dependencies
        run: npm ci

      - name: Build and check
        run: make check

      - name: Deploy to live
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_STUCHLIKOVA_STATIC }}
          projectId: stuchlikova-static
          channelId: live
